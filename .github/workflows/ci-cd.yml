name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  # ========================================
  # Job 1: Code quality & service unit tests
  # (tests live inside each service; the root-level suites are local-only)
  # ========================================
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r services/triage_engine/requirements.txt
        pip install black isort mypy pylint pytest pytest-cov pytest-asyncio bandit safety httpx pyyaml

    - name: Black format check
      run: black --check --line-length 100 services/ || true

    - name: isort import check
      run: isort --check-only services/ || true

    - name: MyPy type check
      run: mypy services/triage_engine --ignore-missing-imports --explicit-package-bases || true

    - name: Run service unit tests
      run: |
        PYTHONPATH=${GITHUB_WORKSPACE}/services:$PYTHONPATH \
        pytest services/triage_engine/tests -v \
          --cov=services/triage_engine \
          --cov-report=term-missing \
          --cov-fail-under=0

    - name: Security scan (Bandit)
      run: |
        bandit -r services/ -f json -o bandit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore

  # ========================================
  # Job 2: Build and push Docker images
  # (deployment assets - helm/k8s - are kept local; deploy stages run there)
  # ========================================
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - ai_triage_agent
          - alert_ingestor
          - alert_normalizer
          - automation_orchestrator
          - configuration_service
          - data_analytics
          - monitoring_metrics
          - notification_service
          - reporting_service
          - similarity_search
          - triage_engine
          - web_dashboard
          - workflow_engine

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
